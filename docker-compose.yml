services:
  postgres:
    image: postgres:17-alpine
    container_name: cixtech-postgres
    restart: unless-stopped
    env_file: ./backend/.env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cixtech_owner} -d $${POSTGRES_DB:-cixtech}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cixtech-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: cixtech-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cixtech_owner}:${POSTGRES_PASSWORD:-cixtech_local_dev}@postgres:5432/${POSTGRES_DB:-cixtech}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-cixtech_owner}:${POSTGRES_PASSWORD:-cixtech_local_dev}@postgres:5432/${POSTGRES_DB:-cixtech}
      REDIS_URL: redis://redis:6379
      CIXTECH_DB_SSL: disable
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: cixtech-worker
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      WORKER_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cixtech_owner}:${POSTGRES_PASSWORD:-cixtech_local_dev}@postgres:5432/${POSTGRES_DB:-cixtech}
      REDIS_URL: redis://redis:6379
      CIXTECH_DB_SSL: disable
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cixtech-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: ./backend/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
