server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /config.js {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Content-Type "application/javascript; charset=utf-8" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # The API surface the consoles call, written by docker-entrypoint.sh.
  #
  # When CIXTECH_API_BASE is empty (the default) these proxy to the API, so the
  # browser only ever talks to this origin -- the API's address never appears in
  # devtools, there is no preflight, and the session cookie can be SameSite=Lax.
  # When CIXTECH_API_BASE is set, the console calls that origin directly and
  # these become the 404s that say so.
  #
  # Included at server level rather than written inline because the upstream has
  # to be templated, and because `location` blocks cannot be built from nginx
  # variables.
  include /etc/nginx/conf.d/api-proxy.inc;

  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;

  location = /healthz { access_log off; return 200 "ok\n"; }
}
