# nginx for the cixtech consoles.
#
# This is a STATIC bundle now, so the security headers the API's helmet used to
# apply no longer reach these pages — the static host has to set them itself, and
# forgetting that would quietly undo CX-13 from the security audit.
#
# The CSP is tight because the consoles need almost nothing: their own scripts and
# styles, Google Fonts (the design system @imports Inter and JetBrains Mono), and
# XHR to the API. `connect-src` is templated from CIXTECH_API_BASE at start-up,
# because a static bundle cannot know at build time which API it will talk to.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache config.js: it carries the per-environment API base, and a cached
  # copy would point a redeployed console at the previous environment's API.
  location = /config.js {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Content-Type "application/javascript; charset=utf-8" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # Next content-hashes everything under /_next/static, so those really are
  # immutable — a changed file gets a changed name. Cache them hard.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # HTML is not hashed and must be revalidated, or a deploy leaves browsers on the
  # previous build pointing at asset names that no longer exist.
  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    # trailingSlash:true means /admin/ is admin/index.html on disk.
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;

  # The API is a separate deployment; nothing here proxies to it. Fail loudly
  # rather than serving an HTML 404 to a fetch() that expected JSON.
  location /v1/  { return 404 '{"error":{"code":"NOT_FOUND","message":"The API is a separate deployment; set CIXTECH_API_BASE"}}'; }
  location /admin/api/ { return 404 '{"error":{"code":"NOT_FOUND","message":"The API is a separate deployment; set CIXTECH_API_BASE"}}'; }

  location = /healthz { access_log off; return 200 "ok\n"; }
}
