server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /config.js {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Content-Type "application/javascript; charset=utf-8" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;

  location /v1/  { return 404 '{"error":{"code":"NOT_FOUND","message":"The API is a separate deployment; set CIXTECH_API_BASE"}}'; }
  location /admin/api/ { return 404 '{"error":{"code":"NOT_FOUND","message":"The API is a separate deployment; set CIXTECH_API_BASE"}}'; }

  location = /healthz { access_log off; return 200 "ok\n"; }
}
